name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Builds the library, the example executables, and every file in
      # Snippets/. A tutorial referencing a renamed API fails here.
      - name: Build
        run: swift build

      - name: Test
        run: swift test
